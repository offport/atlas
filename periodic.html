<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Elements</title>
<style>
/* An interactive periodic table. Click an element to see a 3D atom — a nucleus of protons and
   neutrons wrapped in its real electron shells — that you can spin 360°. (Schematic Bohr model.)
   Data: Bowserinator Periodic-Table-JSON (from Wikipedia). Built with three.js. */
:root{
  --ink:#eef2fb; --muted:#93a2bf; --panel:rgba(14,18,28,.88); --rule:rgba(120,140,185,.22);
  --accent:#8a7bff; --accent2:#5ec8ff;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#080a12;color:var(--ink);font-family:var(--font);overflow:hidden}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}
.glass{background:var(--panel);border:1px solid var(--rule);border-radius:14px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 8px 30px rgba(0,0,0,.45)}

/* ---------- table view ---------- */
#tableView{position:fixed;inset:0;display:flex;flex-direction:column;overflow:auto}
#thead{padding:16px 18px 6px;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
#thead h1{margin:0;font-size:20px;font-weight:800;letter-spacing:.01em;display:flex;align-items:center;gap:8px}
#thead h1 .d{color:var(--accent)}
#thead .sub{font-size:12.5px;color:var(--muted)}
#legend{display:flex;gap:5px 12px;flex-wrap:wrap;margin-left:auto;align-items:center}
.leg{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);cursor:default}
.leg i{width:11px;height:11px;border-radius:3px;display:block}
#gridWrap{flex:1;overflow:auto;padding:4px 18px 20px}
#grid{display:grid;grid-template-columns:repeat(18,minmax(44px,1fr));grid-auto-rows:minmax(44px,1fr);gap:4px;min-width:860px;max-width:1500px;margin:0 auto}
.cell{position:relative;border-radius:7px;border:1px solid var(--cc,#555);background:var(--cb,#1a1d28);cursor:pointer;padding:3px 4px;display:flex;flex-direction:column;justify-content:center;align-items:center;transition:transform .08s,box-shadow .08s;min-height:44px}
.cell:hover{transform:translateY(-2px) scale(1.04);box-shadow:0 6px 18px rgba(0,0,0,.5);z-index:2}
.cell .no{position:absolute;top:2px;left:4px;font-size:9px;color:var(--muted)}
.cell .sym{font-size:17px;font-weight:800;line-height:1;color:var(--sc,#fff)}
.cell .nm{font-size:7.5px;color:var(--muted);margin-top:2px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell .ms{font-size:7px;color:var(--muted);opacity:.8}
.fmark{display:flex;align-items:center;justify-content:center;border:1px dashed var(--rule);border-radius:7px;font-size:10px;color:var(--muted);background:rgba(255,255,255,.02)}
#tfoot{padding:0 18px 16px;font-size:11px;color:var(--muted)}

/* ---------- atom view ---------- */
#atomView{position:fixed;inset:0;z-index:20;display:none}
#atomView.on{display:block}
#atomCanvas{position:absolute;inset:0}
#atomCanvas canvas{display:block;touch-action:none}
#aback{position:fixed;top:14px;left:14px;z-index:22;border:1px solid var(--rule);background:var(--panel);border-radius:10px;padding:9px 14px;font-size:13px;cursor:pointer;font-weight:600}
#aback:hover{background:rgba(255,255,255,.08)}
#adock{position:fixed;left:50%;transform:translateX(-50%);bottom:14px;z-index:22;display:flex;gap:8px;padding:8px 10px}
#adock button{border:1px solid var(--rule);background:rgba(255,255,255,.05);border-radius:9px;padding:8px 12px;font-size:12.5px;cursor:pointer}
#adock button:hover{background:rgba(255,255,255,.12)}
#adock button.active{background:var(--accent2);color:#06121e;border-color:var(--accent2);font-weight:700}
#alegend{position:fixed;left:14px;bottom:70px;z-index:22;display:flex;gap:14px;font-size:11.5px;color:var(--muted);padding:8px 12px}
#alegend span{display:flex;align-items:center;gap:6px}
#alegend i{width:10px;height:10px;border-radius:50%;display:block;box-shadow:0 0 6px currentColor}

#ainfo{position:fixed;top:14px;right:14px;width:330px;max-width:calc(100vw - 28px);max-height:calc(100vh - 110px);overflow-y:auto;z-index:22;padding:0}
.ihead{display:flex;align-items:center;gap:14px;padding:14px 16px 12px;border-bottom:1px solid var(--rule)}
.ihead .badge{width:52px;height:52px;border-radius:11px;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px solid var(--cc);background:var(--cb)}
.ihead .badge .s{font-size:21px;font-weight:800;color:var(--sc);line-height:1}
.ihead .badge .z{font-size:9px;color:var(--muted)}
.ihead h2{margin:0;font-size:19px;font-weight:800}
.ihead .cat{font-size:12px;color:var(--muted)}
.ibody{padding:12px 16px 18px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.st{background:rgba(255,255,255,.04);border:1px solid var(--rule);border-radius:9px;padding:7px 9px}
.st .k{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.st .v{font-size:14px;font-weight:700;margin-top:1px;font-variant-numeric:tabular-nums}
.ibody .econf{font-family:var(--mono);font-size:12px;color:#cfe0f6;background:rgba(255,255,255,.04);border:1px solid var(--rule);border-radius:8px;padding:7px 9px;margin-bottom:10px;word-break:break-word}
.ibody p{font-size:12.5px;line-height:1.55;color:#cdd6ef;margin:8px 0 0}
.ilink{display:inline-block;margin-top:10px;font-size:12px;color:var(--accent2);text-decoration:none}
.ilink:hover{text-decoration:underline}
.credit{font-size:10px;color:var(--muted);margin-top:12px;line-height:1.5;border-top:1px solid var(--rule);padding-top:8px}

#load{position:fixed;inset:0;display:grid;place-items:center;z-index:40;background:#080a12;transition:opacity .5s}
#load.gone{opacity:0;pointer-events:none}
#load .ring{width:44px;height:44px;border-radius:50%;border:3px solid rgba(255,255,255,.15);border-top-color:var(--accent);animation:spin 1s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
#load .t{font-size:12.5px;color:var(--muted);letter-spacing:.06em;text-align:center}
@media (max-width:820px){
  #ainfo{top:auto;bottom:66px;right:12px;left:12px;width:auto;max-height:42vh}
  #alegend{display:none}
  #legend{width:100%;margin-left:0}
}
</style>
</head>
<body>
<div id="load"><div><div class="ring"></div><div class="t">LOADING THE ELEMENTS…</div></div></div>

<div id="tableView">
  <div id="thead">
    <h1><span class="d">⚛</span> The Elements</h1>
    <span class="sub">Click any element to open its atom in 3D.</span>
    <div id="legend"></div>
  </div>
  <div id="gridWrap"><div id="grid"></div></div>
  <div id="tfoot">118 elements · colours group them by family · the two detached rows are the lanthanides and actinides.</div>
</div>

<div id="atomView">
  <div id="atomCanvas"></div>
  <button id="aback">← Back to table</button>
  <aside id="ainfo" class="glass"></aside>
  <div id="alegend" class="glass">
    <span style="color:#ff6a6a"><i></i>Protons</span>
    <span style="color:#8aa6c4"><i></i>Neutrons</span>
    <span style="color:#6fe0ff"><i></i>Electrons</span>
  </div>
  <div id="adock" class="glass">
    <button id="aspin" class="active">Auto-rotate</button>
    <button id="aelec" class="active">Animate electrons</button>
    <button id="areset">Reset view</button>
  </div>
</div>

<script type="module">
import * as THREE from "./solar-assets/three.module.min.js";

/* category → colour + short label */
const CAT=[
  ["alkali metal","#ff7a5c","Alkali metal"],
  ["alkaline earth metal","#ffb259","Alkaline earth"],
  ["transition metal","#ffd95c","Transition metal"],
  ["post-transition metal","#6fd3ff","Post-transition"],
  ["metalloid","#4fe0b0","Metalloid"],
  ["diatomic nonmetal","#9be65b","Nonmetal"],
  ["polyatomic nonmetal","#9be65b","Nonmetal"],
  ["noble gas","#c88bff","Noble gas"],
  ["lanthanide","#ff93c4","Lanthanide"],
  ["actinide","#ff9a8a","Actinide"],
];
const CATMAP=Object.fromEntries(CAT.map(c=>[c[0],c]));
function catInfo(cat){ if(CATMAP[cat]) return CATMAP[cat]; return [cat,"#9aa7bd","Unknown"]; }
function hexToRgb(h){ h=h.replace("#",""); return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]; }

let ELEMENTS=[], byNum={};

/* ---------------------------------------------------------------- table */
async function init(){
  const data=await (await fetch("./periodic-assets/elements.json")).json();
  ELEMENTS=data.elements; byNum=Object.fromEntries(ELEMENTS.map(e=>[e.n,e]));
  buildLegend(); buildGrid();
  const l=document.getElementById("load"); l.classList.add("gone"); setTimeout(()=>l.remove(),600);
}
function buildLegend(){
  const seen=new Set(), out=[];
  for(const [key,col,label] of CAT){ if(seen.has(label)) continue; seen.add(label); out.push(`<span class="leg"><i style="background:${col}"></i>${label}</span>`); }
  out.push(`<span class="leg"><i style="background:#9aa7bd"></i>Unknown</span>`);
  document.getElementById("legend").innerHTML=out.join("");
}
function buildGrid(){
  const grid=document.getElementById("grid");
  // f-block connector markers in the main table (group 3, periods 6 & 7)
  grid.insertAdjacentHTML("beforeend",
    `<div class="fmark" style="grid-column:3;grid-row:6">57–71</div>
     <div class="fmark" style="grid-column:3;grid-row:7">89–103</div>`);
  for(const e of ELEMENTS){
    const [,col]=catInfo(e.cat); const [r,g,b]=hexToRgb(col);
    const el=document.createElement("button"); el.className="cell";
    el.style.gridColumn=e.xpos; el.style.gridRow=e.ypos;
    el.style.setProperty("--cb",`rgba(${r},${g},${b},.17)`);
    el.style.setProperty("--cc",`rgba(${r},${g},${b},.5)`);
    el.style.setProperty("--sc",col);
    el.innerHTML=`<span class="no">${e.n}</span><span class="sym">${e.sym}</span><span class="nm">${e.name}</span><span class="ms">${e.mass}</span>`;
    el.title=`${e.name} — click for 3D atom`;
    el.onclick=()=>openAtom(e);
    grid.appendChild(el);
  }
}

/* ---------------------------------------------------------------- 3D atom */
let renderer, scene, camera, atomGroup, raf=0, atomOpen=false;
let electrons=[], elMesh=null, nucMesh=null, autoRotate=true, animElectrons=true;
let camR=14, camTheta=0.9, camPhi=1.05, tR=camR, baseR=14;

function initThree(){
  const host=document.getElementById("atomCanvas");
  scene=new THREE.Scene(); scene.background=new THREE.Color(0x080a12);
  camera=new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.05, 500);
  renderer=new THREE.WebGLRenderer({antialias:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.setSize(innerWidth,innerHeight);
  renderer.outputColorSpace=THREE.SRGBColorSpace; host.appendChild(renderer.domElement);
  scene.add(new THREE.AmbientLight(0xffffff,0.55));
  const p1=new THREE.PointLight(0xffffff,180,0,2); p1.position.set(6,8,10); scene.add(p1);
  const p2=new THREE.PointLight(0x88aaff,90,0,2); p2.position.set(-8,-4,-6); scene.add(p2);
  // starry backdrop
  const n=900,g=new THREE.BufferGeometry(),pos=new Float32Array(n*3);
  for(let i=0;i<n;i++){ const r=120+Math.random()*120,th=Math.random()*6.283,ph=Math.acos(2*Math.random()-1);
    pos[i*3]=r*Math.sin(ph)*Math.cos(th);pos[i*3+1]=r*Math.cos(ph);pos[i*3+2]=r*Math.sin(ph)*Math.sin(th); }
  g.setAttribute("position",new THREE.BufferAttribute(pos,3));
  scene.add(new THREE.Points(g,new THREE.PointsMaterial({color:0x8899bb,size:.6,transparent:true,opacity:.7})));
  const c=renderer.domElement;
  c.addEventListener("pointerdown",e=>{drag={x:e.clientX,y:e.clientY};c.setPointerCapture(e.pointerId);});
  c.addEventListener("pointermove",e=>{ if(!drag)return; camTheta-=(e.clientX-drag.x)*0.006; camPhi=Math.max(0.12,Math.min(Math.PI-0.12,camPhi-(e.clientY-drag.y)*0.006)); drag.x=e.clientX;drag.y=e.clientY; });
  c.addEventListener("pointerup",()=>drag=null);
  c.addEventListener("wheel",e=>{e.preventDefault(); tR=Math.max(2.5,Math.min(60,tR*(e.deltaY<0?0.9:1.11)));},{passive:false});
  addEventListener("resize",()=>{ if(!atomOpen)return; camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });
}
let drag=null;

function mulberry32(a){ return function(){ a|=0;a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

function buildAtom(e){
  if(atomGroup){ scene.remove(atomGroup); atomGroup.traverse(o=>{ if(o.geometry)o.geometry.dispose(); }); }
  atomGroup=new THREE.Group(); scene.add(atomGroup);
  electrons=[];
  const Z=e.n, nucleons=Math.max(Z, Math.round(e.mass)), N=nucleons-Z;
  // ---- nucleus (protons + neutrons packed in a ball) ----
  const rN=0.11*Math.cbrt(nucleons)*1.7+0.12;
  const nucGeo=new THREE.SphereGeometry(0.12,14,14);
  const nucMat=new THREE.MeshStandardMaterial({roughness:.45,metalness:.15});
  nucMesh=new THREE.InstancedMesh(nucGeo,nucMat,nucleons); nucMesh.instanceMatrix.setUsage(THREE.StaticDrawUsage); nucMesh.frustumCulled=false;
  const rnd=mulberry32(Z*2654435761>>>0), mtx=new THREE.Matrix4(), col=new THREE.Color();
  const pColor=new THREE.Color(0xff5a5a), nColor=new THREE.Color(0x8aa6c4);
  // interleave proton/neutron assignment so colours mix
  const types=[]; for(let i=0;i<nucleons;i++) types.push(i<Z?1:0);
  for(let i=types.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); [types[i],types[j]]=[types[j],types[i]]; }
  for(let i=0;i<nucleons;i++){
    let x,y,z,d; do{ x=rnd()*2-1;y=rnd()*2-1;z=rnd()*2-1; d=x*x+y*y+z*z; }while(d>1);
    mtx.makeTranslation(x*rN,y*rN,z*rN); nucMesh.setMatrixAt(i,mtx);
    nucMesh.setColorAt(i, types[i]?pColor:nColor);
  }
  nucMesh.instanceColor.needsUpdate=true; atomGroup.add(nucMesh);
  // ---- electron shells ----
  const shells=e.shells, nsh=shells.length;
  const r1=rN+0.9, step=1.05;
  let totalE=0; for(const s of shells) totalE+=s;
  const elGeo=new THREE.SphereGeometry(0.11,12,12);
  const elMat=new THREE.MeshBasicMaterial({color:0x6fe0ff});
  elMesh=new THREE.InstancedMesh(elGeo,elMat,totalE); elMesh.frustumCulled=false; atomGroup.add(elMesh);
  let outerR=r1;
  for(let si=0;si<nsh;si++){
    const R=r1+si*step; outerR=R;
    // tilt each shell's orbital plane distinctly
    const q=new THREE.Quaternion().setFromEuler(new THREE.Euler(si*0.9+0.3, si*1.7, si*0.5));
    // faint orbit ring
    const seg=96, rp=new Float32Array((seg+1)*3), v=new THREE.Vector3();
    for(let k=0;k<=seg;k++){ const a=k/seg*Math.PI*2; v.set(Math.cos(a)*R,Math.sin(a)*R,0).applyQuaternion(q); rp[k*3]=v.x;rp[k*3+1]=v.y;rp[k*3+2]=v.z; }
    const rg=new THREE.BufferGeometry(); rg.setAttribute("position",new THREE.BufferAttribute(rp,3));
    atomGroup.add(new THREE.Line(rg,new THREE.LineBasicMaterial({color:0x4a6a9a,transparent:true,opacity:.5})));
    const cnt=shells[si], speed=(0.5+0.8/(si+1))*(si%2?-1:1);
    for(let j=0;j<cnt;j++){ electrons.push({R, q, a:j/cnt*Math.PI*2, speed}); }
  }
  updateElectrons(0);
  // frame the atom
  baseR=(outerR+0.6)*2.3; tR=camR=baseR; camTheta=0.9; camPhi=1.05;
}
const _m=new THREE.Matrix4(), _v=new THREE.Vector3();
function updateElectrons(dt){
  for(let i=0;i<electrons.length;i++){ const e=electrons[i];
    if(animElectrons) e.a+=e.speed*dt;
    _v.set(Math.cos(e.a)*e.R, Math.sin(e.a)*e.R, 0).applyQuaternion(e.q);
    _m.makeTranslation(_v.x,_v.y,_v.z); elMesh.setMatrixAt(i,_m);
  }
  elMesh.instanceMatrix.needsUpdate=true;
}

let lastT=0;
function loop(now){
  if(!atomOpen) return;
  raf=requestAnimationFrame(loop);
  const dt=Math.min(0.05,(now-lastT)/1000||0); lastT=now;
  if(autoRotate) camTheta+=dt*0.35;
  updateElectrons(dt*2.2);
  camR+=(tR-camR)*0.12;
  camera.position.set(camR*Math.sin(camPhi)*Math.cos(camTheta), camR*Math.cos(camPhi), camR*Math.sin(camPhi)*Math.sin(camTheta));
  camera.lookAt(0,0,0);
  renderer.render(scene,camera);
}

/* ---------------------------------------------------------------- open / close + info */
const atomView=document.getElementById("atomView"), ainfo=document.getElementById("ainfo");
function openAtom(e){
  if(!renderer) initThree();
  atomOpen=true; atomView.classList.add("on");
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight);
  buildAtom(e); showInfo(e);
  lastT=performance.now(); cancelAnimationFrame(raf); raf=requestAnimationFrame(loop);
}
function closeAtom(){ atomOpen=false; atomView.classList.remove("on"); cancelAnimationFrame(raf); }
document.getElementById("aback").onclick=closeAtom;
document.getElementById("aspin").onclick=function(){ autoRotate=!autoRotate; this.classList.toggle("active",autoRotate); };
document.getElementById("aelec").onclick=function(){ animElectrons=!animElectrons; this.classList.toggle("active",animElectrons); };
document.getElementById("areset").onclick=()=>{ camTheta=0.9; camPhi=1.05; tR=baseR; };
let current=1;
function showInfo(e){
  current=e.n; const [,col,label]=catInfo(e.cat);
  const [r,g,b]=hexToRgb(col);
  const Z=e.n, nucleons=Math.max(Z,Math.round(e.mass)), N=nucleons-Z;
  ainfo.style.setProperty("--cc",`rgba(${r},${g},${b},.5)`);
  ainfo.style.setProperty("--cb",`rgba(${r},${g},${b},.17)`); ainfo.style.setProperty("--sc",col);
  const summ=(e.summary||"").replace(/\s+/g," ").trim();
  ainfo.innerHTML=`<div class="ihead">
      <div class="badge"><span class="s">${e.sym}</span><span class="z">${e.n}</span></div>
      <div><h2>${e.name}</h2><div class="cat">${label} · ${e.phase||"—"} at 25 °C</div></div>
    </div>
    <div class="ibody">
      <div class="stats">
        <div class="st"><div class="k">Protons</div><div class="v" style="color:#ff6a6a">${Z}</div></div>
        <div class="st"><div class="k">Neutrons</div><div class="v" style="color:#8aa6c4">${N}</div></div>
        <div class="st"><div class="k">Electrons</div><div class="v" style="color:#6fe0ff">${Z}</div></div>
        <div class="st"><div class="k">Atomic mass</div><div class="v">${e.mass}</div></div>
        <div class="st"><div class="k">Group · Period</div><div class="v">${e.group||"—"} · ${e.period}</div></div>
        <div class="st"><div class="k">Block</div><div class="v">${(e.block||"").toUpperCase()}-block</div></div>
      </div>
      <div class="econf"><b>Config:</b> ${e.econf||"—"}<br><b>Shells:</b> ${e.shells.join(" · ")}</div>
      ${summ?`<p>${summ}</p>`:""}
      <a class="ilink" href="https://en.wikipedia.org/wiki/${encodeURIComponent(e.name)}" target="_blank" rel="noopener">Read more on Wikipedia ↗</a>
      <div class="credit">A schematic Bohr model: electrons are shown as particles in fixed shells. Real electrons occupy fuzzy quantum orbitals. Data: Bowserinator Periodic-Table-JSON (Wikipedia).</div>
    </div>`;
}
addEventListener("keydown",e=>{ if(e.key==="Escape"&&atomOpen) closeAtom(); });

// tiny hook for automated checks
window.__ptable={ open:(z)=>{ const e=byNum[z]; if(e) openAtom(e); return !!e; }, close:closeAtom, get count(){return ELEMENTS.length;}, get open_el(){return atomOpen?current:null;} };
init();
</script>
</body>
</html>
